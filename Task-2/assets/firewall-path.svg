<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><rect width="900" height="300" rx="16" fill="#101317"/><g font-family="Arial" text-anchor="middle"><rect x="40" y="95" width="180" height="90" rx="12" fill="#20262e" stroke="#657080" stroke-width="2"/><text x="130" y="130" fill="#f4f4f4" font-size="18" font-weight="bold">Packet arrives</text><text x="130" y="155" fill="#cbd2dc" font-size="13">Interface / route</text><path d="M220 140h65" stroke="#ff2625" stroke-width="3"/><path d="M285 140l-12 -7v14z" fill="#ff2625"/><rect x="290" y="80" width="300" height="120" rx="14" fill="#252d37" stroke="#ff2625" stroke-width="2"/><text x="440" y="111" fill="#ff6a69" font-size="19" font-weight="bold">Firewall rules</text><text x="440" y="140" fill="#f4f4f4" font-size="15">Chain + order + match</text><text x="440" y="164" fill="#cbd2dc" font-size="13">ACCEPT / DROP / REJECT</text><path d="M590 115h65v-35h35M590 165h65v35h35" stroke="#ff2625" stroke-width="3" fill="none"/><path d="M690 80l-12 -7v14zM690 200l-12 -7v14z" fill="#ff2625"/><rect x="695" y="45" width="165" height="65" rx="10" fill="#20262e" stroke="#657080"/><text x="777" y="72" fill="#f4f4f4" font-size="17" font-weight="bold">ACCEPT</text><text x="777" y="92" fill="#cbd2dc" font-size="12">Continue processing</text><rect x="695" y="170" width="165" height="65" rx="10" fill="#20262e" stroke="#657080"/><text x="777" y="197" fill="#f4f4f4" font-size="17" font-weight="bold">DROP / REJECT</text><text x="777" y="217" fill="#cbd2dc" font-size="12">Discard / respond</text><text x="450" y="265" fill="#9ba5b4" font-size="13">Simplified model • actual packet flow depends on routing, tables and connection tracking</text></g></svg>