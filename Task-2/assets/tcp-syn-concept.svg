<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370"><rect width="900" height="370" rx="16" fill="#101317"/><g font-family="Arial" fill="#f4f4f4"><text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold">TCP connection setup (simplified)</text><text x="130" y="74" text-anchor="middle" font-size="17">Client / scanner</text><text x="770" y="74" text-anchor="middle" font-size="17">Server / target</text><path d="M130 90v235M770 90v235" stroke="#657080" stroke-width="2"/><path d="M145 120H750" stroke="#ff2625" stroke-width="3"/><path d="M750 120l-12 -7v14z" fill="#ff2625"/><text x="450" y="110" text-anchor="middle" fill="#ff6a69" font-size="14">SYN</text><path d="M755 165H150" stroke="#ff2625" stroke-width="3"/><path d="M150 165l12 -7v14z" fill="#ff2625"/><text x="450" y="155" text-anchor="middle" fill="#ff6a69" font-size="14">SYN + ACK</text><path d="M145 210H750" stroke="#ff2625" stroke-width="3"/><path d="M750 210l-12 -7v14z" fill="#ff2625"/><text x="450" y="200" text-anchor="middle" fill="#ff6a69" font-size="14">ACK</text><rect x="220" y="242" width="460" height="43" rx="9" fill="#20262e" stroke="#ff2625"/><text x="450" y="269" text-anchor="middle" font-size="15">Normal handshake completes the connection</text><rect x="220" y="296" width="460" height="48" rx="9" fill="#20262e" stroke="#657080"/><text x="450" y="316" text-anchor="middle" font-size="14">SYN scan: infer state from reply; typically no final ACK</text><text x="450" y="333" text-anchor="middle" font-size="11" fill="#cbd2dc">Simplified model; firewall and OS behavior can differ.</text></g></svg>